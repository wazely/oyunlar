<style>

#bars{gap:7px}#bars .bar{padding:5px 6px}#bars .bar span{width:84px}#bars .bar i{display:none}#st{background:linear-gradient(90deg,#2f8fd0,#8fe6ff)}
@keyframes f{to{opacity:0}}

.low{animation:lw 1s infinite}@keyframes lw{50%{opacity:.45}}
body{font-family:'Pixelify Sans','VT323',monospace;font-size:1.08em}

.ct1{display:flex;align-items:center;gap:10px}
.ci{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:9px;background:radial-gradient(circle at 35% 30%,#6b4a2a,#2e1b0d);border:2px solid #24150a;box-shadow:inset 0 0 0 1px rgba(255,210,150,.25)}.ci svg{width:34px;height:34px}
.ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.cn{font:600 14px 'Pixelify Sans','VT323',monospace}.cd{font-size:13px;opacity:.85;line-height:1.2}

.cm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}.cl{font-size:11px;opacity:.65;letter-spacing:.12em;text-transform:uppercase;margin-right:2px}

.ii svg{width:20px;height:20px;display:block}.iq{font:600 12px 'Pixelify Sans','VT323',monospace}.in{font-size:12px;opacity:.9}
#hudb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 120px);right:calc(env(safe-area-inset-right,0px) + 12px)}

b{background-image:var(--wd)!important;background-color:#5b3a21!important;border:2.5px solid #24150a!important;box-shadow:inset 0 2px 0 rgba(255,220,160,.35),inset 0 -3px 6px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.5)!important;backdrop-filter:none!important}

.bar svg{stroke:none;fill:none}.bar span{background:#1b1007;border:1px solid #000;height:10px;box-shadow:inset 0 2px 3px #000}

.pn{width:min(440px,92vw);max-height:86vh;overflow:auto;border-radius:14px;border:4px solid #24150a;background-image:var(--wl);box-shadow:inset 0 0 0 2px #b88a52,0 10px 40px #000;padding:14px;color:#f4e0b0;box-sizing:border-box}

/* ===== piksel (Minecraft tarzı) yazı ===== */
html,body,#ld,.pn,.cr,.ctabs,#toast{-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed}
.pn,.pn .cd,.pn .row,#toast,.sl u,.iq,.in{text-shadow:2px 2px 0 rgba(20,10,4,.85)}
.pn h2{letter-spacing:.18em}
#ld .fact,#ld .tips,#ld .hn{letter-spacing:.02em}

.pn.wide{width:min(800px,97vw);max-height:92vh}
.cinv{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:2px 0 10px;padding:7px;border-radius:10px;background:rgba(0,0,0,.3);border:2px solid #24150a;box-shadow:inset 0 2px 6px #000a}
.ctabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}

.cr .ci{width:56px;height:56px}.cr .ci svg{width:42px;height:42px}

.cg .cr u{display:block;width:100%;box-sizing:border-box;text-align:center;padding:10px 6px;font-size:13px}
.cr:active u{transform:translateY(1px)}
.cr.have u{background:#3d4a5a;color:#bcd0e6}
.ce{grid-column:1/-1;padding:22px;text-align:center;opacity:.8}
