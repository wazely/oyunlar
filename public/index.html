<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unblocked Games For Student - ato</title>
<link rel="icon" href="https://enbabaoyunlarburada.vercel.app/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Space+Grotesk:wght@500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdeff4;
    --bg-2: #fbd9e6;
    --card: #ffffff;
    --text: #3d1226;
    --muted: #9a5b75;
    --line: #f0bfd2;
    --edge: #f3c3d5;
    --accent: #e04a82;
    --accent-dark: #c4306a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    font-family: "Nunito", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    background-color: var(--bg);
    background-image: radial-gradient(rgba(224, 74, 130, .12) 1.2px, transparent 1.2px);
    background-size: 28px 28px;
    position: relative;
    overflow-x: hidden;
  }

  /* Arka plan: sakin, hafif efektler */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .5; animation: float 22s ease-in-out infinite; }
  .b1 { width: 380px; height: 380px; background: #ffc4da; top: -130px; left: -110px; }
  .b2 { width: 340px; height: 340px; background: #ffd3e3; bottom: -130px; right: -90px; animation-delay: -9s; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(24px, 18px); }
  }
  .p {
    position: absolute; bottom: -40px; border-radius: 50%;
    background: rgba(255, 255, 255, .75);
    border: 1.5px solid rgba(224, 74, 130, .3);
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: .8; }
    50% { transform: translate(var(--sway), -55vh); }
    90% { opacity: .6; }
    100% { transform: translate(calc(var(--sway) * -1), -112vh); opacity: 0; }
  }
  .sp {
    position: absolute; color: var(--accent); line-height: 1; opacity: 0;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); }
    50% { opacity: .7; transform: scale(1) rotate(45deg); }
  }

  /* Süsler */
  .hero { position: relative; }
  .deco { position: absolute; right: 0; top: 18px; width: 260px; height: 180px; pointer-events: none; }
  .deco svg { position: absolute; }
  .pad { width: 170px; right: 30px; top: 20px; transform: rotate(9deg); animation: bob 5s ease-in-out infinite; }
  .st1 { width: 34px; right: 215px; top: 6px; transform: rotate(-12deg); }
  .st2 { width: 22px; right: 8px; top: 0; transform: rotate(14deg); }
  .st3 { width: 26px; right: 4px; top: 128px; transform: rotate(-8deg); }
  .ht { width: 26px; right: 226px; top: 120px; transform: rotate(-14deg); }
  .sq { width: 90px; right: 70px; top: 150px; }
  @keyframes bob { 0%, 100% { transform: rotate(9deg) translateY(0); } 50% { transform: rotate(6deg) translateY(-8px); } }

  .ribbon {
    width: 104vw; margin: 34px 0 6px calc(50% - 52vw);
    transform: rotate(-1.2deg);
    background: var(--accent);
    border-top: 3px dashed rgba(255,255,255,.7);
    border-bottom: 3px dashed rgba(255,255,255,.7);
    box-shadow: 0 4px 0 var(--accent-dark);
    overflow: hidden; white-space: nowrap;
    color: #fff;
  }
  .ribbon-track { display: inline-flex; padding: 9px 0; animation: slide 28s linear infinite; }
  .ribbon-track span { font-family: "Space Grotesk", "Nunito", sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .12em; padding: 0 14px; }
  @keyframes slide { to { transform: translateX(-50%); } }

  .wrap {
    position: relative; z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 40px;
  }

  /* Üst bar */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img {
    width: 52px; height: 52px; aspect-ratio: 1 / 1;
    border-radius: 14px; object-fit: cover; object-position: center;
    border: 2px solid #fff;
    box-shadow: 0 3px 0 var(--edge);
  }
  .brand .rgb { font-size: 22px; font-weight: 900; letter-spacing: .01em; }
  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 10px;
    background: #fff; border: 2px solid var(--line);
    font-size: 13px; color: var(--accent-dark);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }

  /* Hero */
  .hero { padding: 52px 0 26px; }
  h1 {
    font-family: "Caveat", "Segoe Script", "Brush Script MT", cursive;
    font-size: clamp(34px, 7vw, 66px);
    font-weight: 700;
    line-height: 1.2;
    min-height: 1.3em;
    color: var(--text);
  }
  #typed { color: var(--accent-dark); }
  .cursor {
    display: inline-block; width: .06em; height: .8em; margin-left: .06em;
    vertical-align: -.05em; background: var(--accent); border-radius: 2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* made by ato */
  .credit {
    display: flex; align-items: center; gap: 6px;
    margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--muted);
  }
  .rgb {
    font-weight: 900;
    background: linear-gradient(90deg, #ff0040, #ff9900, #ffee00, #00e676, #00b0ff, #7c4dff, #ff0040);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: rgb 4s linear infinite;
  }
  @keyframes rgb { to { background-position: 300% 0; } }
  .tick { width: 16px; height: 16px; flex: none; }

  .fx { font-family: "Space Grotesk", "Nunito", system-ui, sans-serif; letter-spacing: .02em; font-weight: 700; }

  /* Etiketler */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 13px; border-radius: 10px;
    background: #fff; border: 2px solid var(--line);
    font-size: 14px; font-weight: 800; color: var(--text);
  }
  .chip svg { width: 16px; height: 16px; color: var(--accent); }

  /* Bölüm başlığı + arama */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 14px; margin: 36px 0 20px;
  }
  .bar h2 { font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
  .count {
    font-size: 13px; font-weight: 800; color: #fff;
    background: var(--accent);
    padding: 2px 10px; border-radius: 8px;
  }
  .search { position: relative; width: 100%; max-width: 280px; }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--accent); }
  .search input {
    width: 100%; padding: 10px 14px 10px 40px;
    border-radius: 12px; border: 2px solid var(--line);
    background: #fff;
    font: inherit; font-weight: 700; color: var(--text);
    outline: none; transition: border-color .15s;
  }
  .search input::placeholder { color: #cf8fb0; }
  .search input:focus { border-color: var(--accent); }

  /* Kartlar: küçük, soldan başlar */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 150px);
    justify-content: start;
    gap: 20px 18px;
  }
  .card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 9px 9px 11px;
    text-decoration: none; color: inherit;
    box-shadow: 0 5px 0 var(--edge);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display: flex; flex-direction: column;
    position: relative;
  }
  /* kâğıt bandı */
  .card::after {
    content: ""; position: absolute; top: -9px; left: 60%;
    width: 52px; height: 16px;
    background: rgba(255, 190, 215, .8);
    border-left: 2px dotted rgba(255,255,255,.7);
    border-right: 2px dotted rgba(255,255,255,.7);
    transform: rotate(4deg);
    pointer-events: none;
  }
  .card:nth-child(even)::after { transform: rotate(-5deg); left: 54%; background: rgba(255, 214, 140, .75); }
  .card:nth-child(3n)::after { transform: rotate(2deg); background: rgba(190, 225, 255, .75); }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 9px 0 var(--edge);
  }
  .card:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--edge); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .thumb { position: relative; }
  .card img {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
    border-radius: 11px; display: block; background: var(--bg-2);
  }
  .tag {
    position: absolute; top: -6px; left: -8px;
    font-size: 11px; font-weight: 900; color: #fff;
    background: var(--accent);
    padding: 2px 8px; border-radius: 6px;
    transform: rotate(-6deg);
    box-shadow: 0 2px 0 var(--accent-dark);
  }
  .card .name { margin: 10px 2px 9px; font-size: 17px; font-weight: 800; letter-spacing: .02em; line-height: 1.2; }
  .card .cat { margin: -6px 2px 9px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .card .play {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 8px 0 7px; margin-top: auto;
    font-size: 15px; font-weight: 900; letter-spacing: .05em; color: #fff;
    background: var(--accent);
    border-radius: 11px;
    box-shadow: 0 3px 0 var(--accent-dark);
    transition: background .15s, transform .15s, box-shadow .15s;
  }
  .card .play svg { width: 12px; height: 12px; transition: transform .2s; }
  .card:hover .play { background: #ea5a90; }
  .card:hover .play svg { transform: translateX(3px); }
  .card:active .play { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }

  .empty { display: none; padding: 30px 0; color: var(--muted); font-weight: 700; }

  footer {
    margin-top: 56px; padding-top: 20px;
    border-top: 2px dashed var(--line);
    display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between;
    font-size: 13px; color: var(--muted);
  }
  footer .credit { margin: 0; font-size: 13px; }

  @media (max-width: 480px) {
    .wrap { padding: 0 16px 32px; }
    .hero { padding-top: 30px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px 14px; }
    .search { max-width: none; }
    .brand .rgb { font-size: 19px; }
    .deco { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob, .cursor, .rgb, .pad, .ribbon-track { animation: none; }
    .p, .sp { display: none; }
    .card, .card .play { transition: none; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div>

  </div>

  <div class="wrap">
    <nav>
      <div class="brand">
        <img src="https://enbabaoyunlarburada.vercel.app/logo.png" alt="Logo">

        <svg class="st2" viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#ffe9a8" stroke="#e04a82" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <svg class="st3" viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#ffe9a8" stroke="#e04a82" stroke-width="1.6" stroke-linejoin="round"/></svg>

<script>
  // ---- Oyun kartları: yeni oyun eklemek için listeye bir satır ekle ----
  const BASE = "https://enbabaoyunlarburada.vercel.app";
  const games = [
    {
      name: "紫电枪魂",
      cat: "Silah oyunu",
      tag: "Yeni",
      icon: BASE + "/cinceoyun.jpg",
      url: BASE + "/silahoyunu"
    },
    {
      name: "ZİRVE",
      cat: "Hayatta kalma",
      tag: "Yeni",
      icon: BASE + "/zirve.jpg",
      url: BASE + "/survival"
    },
    {
      name: "Minecraft",
      cat: "Blok oyunu",

      icon: BASE + "/minecraft.png",
      url: BASE + "/minecraft"
    },
    {
      name: "İnfinite Garden",

      tag: "Yeni",
      icon: BASE + "/infinitegarden.jpg",
      url: BASE + "/garipoyun"
    },
    {
      name: "Saltline",
      cat: "FPS Shooter",
      tag: "Yeni",
      icon: BASE + "/saltline.jpg",
      url: BASE + "/jimao3d"
    },
    {
      name: "Brawl Stars",
      cat: "Aksiyon",
      tag: "Yeni",
      icon: BASE + "/brawlstars.png",
      url: BASE + "/brawlstars"
    },
    {
      name: "Plants Vs Zombies",
      cat: "Strateji",
      tag: "Yeni",
      icon: BASE + "/pvz.jpg",
      url: BASE + "/pvz"
    },
    {
      name: "MatuCraft",
      cat: "Blok oyunu",
      tag: "Yeni",
      icon: BASE + "/matucraft.jpg",
      url: BASE + "/matucraft"
    },
    {
      name: "Pinky Promise",
      cat: "Sana söz",
      tag: "Yeni",
      icon: BASE + "/pinkypromise.webp",
      url: BASE + "/pinkypromise"
    },
    {
      name: "Scribble Wheels",
      cat: "Yol çiz",
      tag: "Yeni",
      icon: BASE + "/scribblewheels.webp",
      url: BASE + "/scribblewheels"
    },
    {
      name: "Sticker Legion",
      cat: "Hangisini seçiceksin?",
      tag: "Yeni",
      icon: BASE + "/stickerlegion.webp",
      url: BASE + "/stickerlegion"
    },
    {
      name: "Reflex Dot",
      cat: "Refleklerini test et!",
      tag: "Yeni",
      icon: BASE + "/reflexdot.jpg",
      url: BASE + "/reflexdot"
    },
    {
      name: "Crate Escape",
      cat: "Fall Guys?!",
      tag: "Yeni",
      icon: BASE + "/crateescape.jpg",
      url: BASE + "/crateescape"
    },
    {
      name: "Rainbow Mixlab",
      cat: "Karıştır!",
      tag: "Yeni",
      icon: BASE + "/mixlab.jpg",
      url: BASE + "/mixlab"
    }
  ];

  const grid = document.getElementById("grid");
  const countEl = document.getElementById("count");
  const emptyEl = document.getElementById("empty");

  function render(filter = "") {
    grid.innerHTML = "";
    const f = filter.trim().toLocaleLowerCase("tr");
    const list = games.filter(g => (g.name + " " + (g.cat || "")).toLocaleLowerCase("tr").includes(f));

    list.forEach(g => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = g.url;

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      const img = document.createElement("img");
      img.src = g.icon;
      img.alt = g.name + " ikonu";
      thumb.appendChild(img);
      if (g.tag) {
        const t = document.createElement("span");
        t.className = "tag";
        t.textContent = g.tag;
        thumb.appendChild(t);
      }

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = g.name;

      const cat = document.createElement("div");
      cat.className = "cat";
      cat.textContent = g.cat || "";
      if (!g.cat) cat.style.display = "none";

      const play = document.createElement("span");
      play.className = "play";
      play.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 .8v10.4L11 6z" fill="currentColor"/></svg>Oyna';

      a.append(thumb, name, cat, play);
      grid.appendChild(a);
    });

    countEl.textContent = games.length;
    emptyEl.style.display = list.length ? "none" : "block";
  }

  render();
  document.getElementById("q").addEventListener("input", e => render(e.target.value));

  // ---- Arka plan: yükselen baloncuklar ve hafif parıltılar ----
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const box = document.getElementById("fx");
    const r = (a, b) => a + Math.random() * (b - a);

    for (let i = 0; i < 12; i++) {
      const d = document.createElement("span");
      d.className = "p";
      const size = r(8, 26);
      d.style.cssText = `left:${r(0, 100)}%;width:${size}px;height:${size}px;` +
        `--sway:${r(-40, 40)}px;animation-duration:${r(16, 30)}s;animation-delay:${-r(0, 30)}s;`;
      box.appendChild(d);
    }
    for (let i = 0; i < 8; i++) {
      const s = document.createElement("span");
      s.className = "sp";
      s.textContent = "✦";
      s.style.cssText = `left:${r(0, 100)}%;top:${r(0, 100)}%;font-size:${r(10, 18)}px;` +
        `animation-duration:${r(4, 8)}s;animation-delay:${-r(0, 8)}s;`;
      box.appendChild(s);
    }
  })();

  // ---- Başlık: harf harf yazılır, sonra silme tuşuna basılmış gibi silinir ----
  const phrases = [
    "Bütün oyunlar engelsizdir",
    "Tamamen ücretsiz",
    "Denediğin için teşekkürler!",
    "Bir oyunu denesene"
  ];
  const el = document.getElementById("typed");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (reduce) {
    let i = 0;
    el.textContent = phrases[0];
    setInterval(() => { i = (i + 1) % phrases.length; el.textContent = phrases[i]; }, 3000);
  } else {
    let p = 0, c = 0, deleting = false;
    function tick() {
      const word = phrases[p];
      if (!deleting) {
        c++;
        el.textContent = word.slice(0, c);
        if (c === word.length) { deleting = true; return setTimeout(tick, 1600); }
        setTimeout(tick, 70 + Math.random() * 50);
      } else {
        c--;
        el.textContent = word.slice(0, c);
        if (c === 0) { deleting = false; p = (p + 1) % phrases.length; return setTimeout(tick, 400); }
        setTimeout(tick, 35);
      }
    }
    tick();
  }
</script>
</body>
