<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pinky Promise — The Totally Honest Platformer</title>
<meta name="description" content="A Joycrate Original. A tiny platformer whose level swears it has no traps. It is lying.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#17151c;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#17151c}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;overflow:hidden;--u:1px;background:#F4E3B2}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hb{position:absolute;top:calc(var(--u)*6);width:calc(var(--u)*22);height:calc(var(--u)*22);border-radius:calc(var(--u)*6);border:calc(var(--u)*1.6) solid #17151c;background:#fff8e7;font-size:calc(var(--u)*12);font-weight:900;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#17151c;box-shadow:0 calc(var(--u)*1.6) 0 #17151c}
.hb:active{transform:translateY(calc(var(--u)*1.6));box-shadow:none}
#bPause{right:calc(var(--u)*6)}#bRe{right:calc(var(--u)*32)}
.playing .hb{display:flex}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*7);text-align:center;padding:calc(var(--u)*10);background:rgba(244,227,178,.93);background-image:radial-gradient(rgba(23,21,28,.09) calc(var(--u)*1.1),transparent calc(var(--u)*1.3));background-size:calc(var(--u)*12) calc(var(--u)*12)}
.ov.on{display:flex}
.logo{font-family:"Arial Black","Arial Rounded MT Bold",Impact,system-ui,sans-serif;font-weight:900;font-size:calc(var(--u)*44);line-height:.9;letter-spacing:calc(var(--u)*-1.5);color:#17151c;transform:rotate(-3deg);text-shadow:calc(var(--u)*3) calc(var(--u)*3) 0 #FFD31D}
.logo span{display:block}
.logo .l2{color:#1F6F6B;margin-left:calc(var(--u)*30)}
.tag{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:calc(var(--u)*10.5);background:#17151c;color:#fff8e7;padding:calc(var(--u)*3) calc(var(--u)*8);border-radius:calc(var(--u)*4);transform:rotate(1.5deg)}
.tag s{opacity:.6}
.row{display:flex;gap:calc(var(--u)*8);flex-wrap:wrap;justify-content:center;align-items:center}
.btn{font:inherit;font-weight:900;font-size:calc(var(--u)*13);padding:calc(var(--u)*7) calc(var(--u)*16);border-radius:calc(var(--u)*9);border:calc(var(--u)*2) solid #17151c;background:#fff8e7;color:#17151c;cursor:pointer;box-shadow:0 calc(var(--u)*3) 0 #17151c;transition:transform .06s}
.btn:hover{transform:translateY(calc(var(--u)*-1))}
.btn:active{transform:translateY(calc(var(--u)*3));box-shadow:none}
.btn.big{background:#FFD31D;font-size:calc(var(--u)*17);padding:calc(var(--u)*8) calc(var(--u)*28)}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none;transform:none}
.badge{position:absolute;bottom:calc(var(--u)*7);left:0;right:0;font-size:calc(var(--u)*8);font-weight:900;letter-spacing:calc(var(--u)*1.2);text-transform:uppercase;opacity:.7}
.keys{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:calc(var(--u)*8.5);font-weight:700;opacity:.75}
h2{margin:0;font-family:"Arial Black","Arial Rounded MT Bold",Impact,sans-serif;font-size:calc(var(--u)*24);letter-spacing:calc(var(--u)*-.6)}
.sub{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:calc(var(--u)*10)}
#grid{display:grid;grid-template-columns:auto repeat(4,calc(var(--u)*34));gap:calc(var(--u)*4) calc(var(--u)*6);align-items:center}
#grid .cn{font-size:calc(var(--u)*9);font-weight:900;text-align:right;padding-right:calc(var(--u)*4)}
#grid button{font:inherit;font-weight:900;font-size:calc(var(--u)*10);height:calc(var(--u)*20);border-radius:calc(var(--u)*6);border:calc(var(--u)*1.6) solid #17151c;cursor:pointer;box-shadow:0 calc(var(--u)*2) 0 #17151c;padding:0}
#grid button:active{transform:translateY(calc(var(--u)*2));box-shadow:none}
#grid button[disabled]{opacity:.28;cursor:default;box-shadow:none}
.stats{display:flex;gap:calc(var(--u)*10)}
.stat{background:#fff8e7;border:calc(var(--u)*2) solid #17151c;border-radius:calc(var(--u)*8);padding:calc(var(--u)*5) calc(var(--u)*12);box-shadow:0 calc(var(--u)*3) 0 #17151c}
.stat b{display:block;font-family:"Arial Black",Impact,sans-serif;font-size:calc(var(--u)*20)}
.stat i{font-style:normal;font-size:calc(var(--u)*8);font-weight:900;letter-spacing:calc(var(--u)*1);text-transform:uppercase}
#pad{position:absolute;display:none;pointer-events:none}
#pad.on{display:block}
#lr,#jb{position:absolute;pointer-events:auto;touch-action:none}
#lr{display:flex;gap:4%}
.pb{flex:1;border-radius:22%;border:3px solid rgba(255,248,231,.9);background:rgba(255,248,231,.14);display:flex;align-items:center;justify-content:center;color:#fff8e7;font-size:34px;font-weight:900}
.pb.dn{background:rgba(255,211,29,.85);color:#17151c;border-color:#FFD31D}
#jb{border-radius:50%}
#jb.pb{font-size:15px;letter-spacing:1px}
#pad.over .pb{border-color:rgba(23,21,28,.55);color:rgba(23,21,28,.7);background:rgba(255,248,231,.25)}
#pad.over .pb.dn{background:rgba(255,211,29,.85);color:#17151c}
#pad svg{width:46%;height:46%}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <button class="hb" id="bRe" aria-label="Restart level">&#8635;</button>
    <button class="hb" id="bPause" aria-label="Pause">II</button>

    <div class="ov on" id="oTitle">
      <div class="logo"><span>PINKY</span><span class="l2">PROMISE</span></div>
      <div class="tag">the totally honest platformer <s>(no traps)</s></div>
      <div class="row" style="margin-top:calc(var(--u)*6)">
        <button class="btn big" id="bPlay">PLAY</button>
      </div>
      <div class="row">
        <button class="btn" id="bLevels">LEVELS</button>
        <button class="btn" id="bSound">SOUND: ON</button>
      </div>
      <div class="keys" id="keysHint">MOVE &larr; &rarr; or A D &nbsp;&middot;&nbsp; JUMP space / &uarr; / W &nbsp;&middot;&nbsp; R restart</div>
      <div class="badge">&#9733; A Joycrate Original &#9733;</div>
    </div>

    <div class="ov" id="oLevels">
      <h2>PICK A PROMISE</h2>
      <div id="grid"></div>
      <div class="row"><button class="btn" id="bBack">BACK</button></div>
    </div>

    <div class="ov" id="oPause">
      <h2>PAUSED</h2>
      <div class="sub" id="pInfo"></div>
      <div class="row"><button class="btn big" id="bResume">RESUME</button></div>
      <div class="row">
        <button class="btn" id="bSkip">SKIP LEVEL</button>
        <button class="btn" id="bSound2">SOUND: ON</button>
        <button class="btn" id="bMenu">MENU</button>
      </div>
      <div class="sub" id="skipInfo" style="opacity:.7"></div>
    </div>

    <div class="ov" id="oEnd">
      <h2>THE END. <span style="color:#1F6F6B">PINKY PROMISE.</span></h2>
      <div class="sub" id="eLine"></div>
      <div class="stats">
        <div class="stat"><b id="eDeaths">0</b><i>deaths</i></div>
        <div class="stat"><b id="eTime">0:00</b><i>time</i></div>
      </div>
      <div class="tag" id="eRank"></div>
      <div class="row">
        <button class="btn big" id="bAgain">PLAY AGAIN</button>
        <button class="btn" id="bLevels2">LEVELS</button>
      </div>
      <div class="badge">&#9733; A Joycrate Original &#9733;</div>
    </div>
  </div>

  <div id="pad">
    <div id="lr">
      <div class="pb" id="pl"><svg viewBox="0 0 24 24"><path d="M16 4 6 12l10 8z" fill="currentColor"/></svg></div>
      <div class="pb" id="pr"><svg viewBox="0 0 24 24"><path d="M8 4l10 8-10 8z" fill="currentColor"/></svg></div>
    </div>
    <div class="pb" id="jb">JUMP</div>
  </div>
</div>

<script>
(()=>{'use strict';
/* ============================================================
   PINKY PROMISE — The Totally Honest Platformer   v1.1
   A Joycrate Original. Single file, no external assets.
   ============================================================ */
const W=480,H=270,FY=200,DT=1/120,SPD=110,JV=262,GR=780;
const SAVE='pinkyPromise_save_v1';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),stage=$('stage'),pad=$('pad');

let save={un:0,deaths:0,time:0,mute:false,done:false};
try{const s=JSON.parse(localStorage.getItem(SAVE)||'null');if(s&&typeof s==='object')save=Object.assign(save,s)}catch(e){}
const store=()=>{try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(e){}};

const PAL=[
 {bg:'#F4E3B2',fg:'#1F6F6B',ink:'#17151c',ac:'#E4572E'},
 {bg:'#FFC6D3',fg:'#5B2A5E',ink:'#17151c',ac:'#E4472B'},
 {bg:'#BFE6F2',fg:'#1D3557',ink:'#17151c',ac:'#E4572E'},
 {bg:'#D5EDB9',fg:'#2F5D3A',ink:'#17151c',ac:'#E4472B'},
 {bg:'#FFB55A',fg:'#6B1F1F',ink:'#17151c',ac:'#FFF3D6'},
 {bg:'#20202B',fg:'#FFD31D',ink:'#FFF8E7',ac:'#FF5D73'}
];
const CHN=['Baby Steps','Trust Falls','Control Freak','Bad Company','Mind Games','Last Promise'];
const QUIPS=['Weird. Never seen that before.','That one was on you.','Huh. Must be a bug.','I would never.','Technically, you did that.','Oops. Butterfingers.','Not a trap. A surprise.','Have you tried not dying?','I felt that one too.','The floor says sorry.','That was the wind. Probably.','Promise still stands.','You walked into it. Literally.','Totally unrelated to me.'];

/* ---------------- state ---------------- */
let g=null,p=null,f=null;
let mode='menu';           // menu | play | pause | end
let cur=0;                 // level index
const stains={};           // death marks per level (session only)
const deathsHere={};
const k={l:false,r:false,j:false};
let SIM=false,bot=null,ck63=1,lvT=0,lvI=-1;

/* ---------------- audio ---------------- */
let AC=null,MG=null,musT=0,musI=0,musTimer=null;
const BAS=[45,0,52,0,45,0,52,50,41,0,48,0,40,0,47,44,45,0,52,0,45,0,52,50,41,0,43,0,40,40,0,0];
const MEL=[0,69,0,72,0,69,76,0,0,65,0,69,0,64,0,68,0,69,0,72,0,76,81,0,77,0,74,0,71,0,68,0];
function audio(){
  if(AC&&AC.state==='suspended'&&!document.hidden)AC.resume();
  if(AC||SIM)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=save.mute?0:1;MG.connect(AC.destination);
    musT=AC.currentTime+.1;musTimer=setInterval(music,70)}catch(e){AC=null}
}
function tone(fr,t0,d,type,vol,f2){
  if(!AC)return;const o=AC.createOscillator(),ga=AC.createGain();o.type=type;o.frequency.setValueAtTime(fr,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  ga.gain.setValueAtTime(vol,t0);ga.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(ga);ga.connect(MG);o.start(t0);o.stop(t0+d+.03);
}
let NB=null;
function noise(t0,d,vol,lp){
  if(!AC)return;
  if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const s=AC.createBufferSource(),ga=AC.createGain(),fl=AC.createBiquadFilter();s.buffer=NB;fl.type='lowpass';fl.frequency.value=lp;
  ga.gain.setValueAtTime(vol,t0);ga.gain.exponentialRampToValueAtTime(.001,t0+d);s.connect(fl);fl.connect(ga);ga.connect(MG);s.start(t0);s.stop(t0+d+.03);
}
function sfx(n){
  if(!AC||SIM)return;const t=AC.currentTime;
  if(n==='jump')tone(310,t,.12,'square',.05,600);
  else if(n==='die'){tone(260,t,.32,'sawtooth',.09,45);noise(t,.22,.16,1100)}
  else if(n==='win'){[523,659,784,1047].forEach((q,i)=>tone(q,t+i*.075,.18,'triangle',.13))}
  else if(n==='pop')tone(760,t,.07,'square',.05,280);
  else if(n==='thud'){noise(t,.28,.32,240);tone(85,t,.22,'sine',.28,38)}
  else if(n==='rumble')noise(t,.4,.13,170);
  else if(n==='flip')tone(190,t,.32,'sine',.1,820);
  else if(n==='tick')tone(950,t,.03,'square',.03);
  else if(n==='oops'){tone(392,t,.12,'triangle',.1);tone(277,t+.13,.22,'triangle',.1)}
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function music(){
  if(!AC||AC.state!=='running')return;
  if(musT<AC.currentTime-.3)musT=AC.currentTime+.05;
  while(musT<AC.currentTime+.2){
    const b=BAS[musI],m=MEL[musI];
    if(mode==='play'||mode==='menu'||mode==='pause'){
      if(b)tone(mf(b),musT,.2,'triangle',.07);
      if(m)tone(mf(m),musT,.11,'square',.018);
      if(musI%4===2)noise(musT,.03,.02,6000);
    }
    musT+=.2;musI=(musI+1)%32;
  }
}
function setMute(m){save.mute=m;store();if(MG)MG.gain.value=m?0:1;$('bSound').textContent=$('bSound2').textContent='SOUND: '+(m?'OFF':'ON')}

/* ---------------- level-building API ---------------- */
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function S(x,y,w,h,o){const s=Object.assign({x,y,w,h,px:x,py:y,solid:true,vis:true,sh:0,seen:0},o);g.solids.push(s);return s}
function K(x,y,w,h,dir,o){const s=Object.assign({x,y,w,h,dir,on:true,vis:true,sh:0},o);g.spikes.push(s);return s}
const fl=(a,b,o)=>S(a,FY,b-a,130,o);
const spk=(a,b,o)=>K(a,FY-8,b-a,8,'u',o);
const hid=(a,b)=>K(a,FY,b-a,8,'u',{on:false});
function Z(r,fn){g.zones.push({r,fn,done:false})}
function X(cond,fn){g.whens.push({cond,fn,done:false})}
const at=(x,fn)=>X(()=>p.x>x,fn);
const atL=(x,fn)=>X(()=>p.x<x,fn);
function after(t,fn){g.timers.push({t,fn})}
function tw(o,to,d,ease,done){const from={};for(const q in to)from[q]=o[q];g.tweens.push({o,from,to,t:0,d,ease:ease||'io',done})}
function shake(o,d){o.sh=d}
function say(t){g.cap.text=t;g.cap.n=0}
function quake(a){g.quake=Math.max(g.quake,a||.25)}
function star(x,y){g.goal={x:x-7,y:(y==null?FY:y)-18,w:14,h:18,on:true,vis:true,legs:false,bob:true};return g.goal}
function fall(s,pre){pre=pre==null?.25:pre;shake(s,pre);sfx('rumble');after(pre,()=>tw(s,{y:s.y+170},.5,'in'))}
function pop(sp,pre){pre=pre==null?.3:pre;puff(sp.x+sp.w/2,FY,6);after(pre,()=>{sp.on=true;tw(sp,{y:sp.y-8},.07,'out');sfx('pop')})}
function puff(x,y,n,c){if(SIM)return;for(let i=0;i<n;i++)g.parts.push({x:x+(Math.random()-.5)*14,y:y-1,vx:(Math.random()-.5)*50,vy:-20-Math.random()*50,life:.35+Math.random()*.25,r:1.6,c:c||null,gr:150})}
function slam(c,pre,then){pre=pre==null?.18:pre;shake(c,pre);after(pre,()=>tw(c,{y:c.y+80},.09,'in',()=>{sfx('thud');quake(.3);after(.45,()=>tw(c,{y:c.y-80},1,'io',then))}))}
function pin(x){return K(x-4,26,8,16,'pin')}
function dropPin(q){shake(q,.1);after(.1,()=>tw(q,{y:FY-16},.55,'in',()=>{q.on=false;sfx('tick')}))}

/* bot helpers (also used by the self-test) */
const px=v=>()=>p.x>v, pl=v=>()=>p.x<v, land=(G,st)=>st>.1&&p.on, win=()=>false;

/* ---------------- levels ---------------- */
const LV=[
/* ===== 1 · Baby Steps ===== */
{cap:'This level is 100% safe. Pinky promise.',hint:'psst: jump when the floor starts to shake.',
 build(){fl(0,200);const B=fl(200,250);fl(250,360);const D=fl(360,410);fl(410,480);star(445);
  at(150,()=>{fall(B);after(.5,()=>say('…That was just a draft.'))});at(300,()=>fall(D))},
 sol:[['R',px(186)],['RJ',land],['R',px(346)],['RJ',land],['R',win]]},

{cap:'Okay. THAT was the only pit.',hint:'psst: the star panics. Chase it back.',
 build(){fl(0,200);const B=fl(200,250);fl(250,480);const G=star(445);const q=hid(300,330);
  at(150,()=>fall(B));at(258,()=>pop(q,.28));
  at(408,()=>{G.on=false;G.legs=true;G.bob=false;sfx('oops');say('It ran. That is on the star, not me.');
   tw(G,{x:13},1.1,'io',()=>{G.on=true;G.legs=false;G.bob=true});tw(G,{y:G.y-72},.55,'out',()=>tw(G,{y:FY-18},.55,'in'))})},
 sol:[['R',px(186)],['RJ',land],['R',px(280)],['RJ',land],['R',px(410)],['L',pl(346)],['LJ',land],['L',pl(262)],['LJ',land],['L',win]]},

{cap:'No surprises overhead.',hint:'psst: step in, step back, wait. Never wait on thin floor.',
 build(){fl(0,205);const T=fl(205,240);fl(240,480);star(452);
  const c1=S(130,-180,50,300),c2=S(240,-180,50,300),c3=S(350,-180,50,300);
  at(113,()=>slam(c1));
  at(193,()=>after(.55,()=>fall(T,.12)));
  at(290,()=>slam(c3,.18,()=>at(345,()=>slam(c3,.25))))},
 sol:[['R',px(114)],['L',.2],['',1.1],['R',px(302)],['',1.75],['R',px(347)],['L',.3],['',1.6],['R',win]]},

{cap:'The star will NOT run away this time.',hint:'psst: walk the wobbly bit. Jump OVER the button.',
 build(){const A=fl(0,200),B=fl(200,250),C=fl(250,300),D=fl(300,410),P=S(410,FY,70,130);const G=star(441);
  g.decor.push({type:'plate',x:384,w:26});
  at(150,()=>shake(B,.7));
  X(()=>p.ground===C&&g.t-p.landT<.05&&p.landAir>.25,()=>fall(C,.04));
  Z({x:384,y:FY-8,w:26,h:8},()=>{sfx('oops');quake(.2);tw(P,{y:FY-96},.35,'out');tw(G,{y:G.y-96},.35,'out');
   say('It did not run. It ROSE. Different.');after(1.4,()=>[A,B,C,D].forEach(s=>fall(s,.6)))})},
 sol:[['R',px(356)],['RJ',win]]},

/* ===== 2 · Trust Falls ===== */
{cap:'Every platform here is real.',hint:'psst: one is fake, one is invisible, one is in a hurry.',
 build(){fl(0,90);S(130,FY,40,12);S(210,FY,40,12,{solid:false});const h=S(205,230,50,10,{vis:false});S(290,FY,40,12);const c=S(370,FY,40,12);fl(440,480);star(460);
  X(()=>p.ground===h,()=>{h.vis=true;say('…That one was a spare.')});
  const arm=()=>X(()=>p.ground===c,()=>{shake(c,.3);after(.3,()=>tw(c,{y:FY+220},.5,'in',()=>after(1.5,()=>{c.y=H+10;tw(c,{y:FY},.4,'out',arm)})))});arm()},
 sol:[['R',px(80)],['RJ',land],['R',()=>p.y>210&&p.on],['R',px(236)],['RJ',land],['R',px(318)],['RJ',land],['RJ',win]]},

{cap:'Nothing is hiding in the air.',hint:'psst: watch where the dust settles.',
 build(){g.dust=1;fl(0,130);S(130,FY,60,10,{vis:false});S(215,FY,45,10,{vis:false});fl(260,340);
  S(345,170,30,8,{vis:false});S(372,140,28,8,{vis:false});S(400,120,80,220);star(446,120)},
 sol:[['R',px(178)],['RJ',land],['R',px(298)],['RJ',land],['RJ',land],['RJ',land],['R',win]]},

{cap:'That is definitely the star.',hint:'psst: have you checked behind you?',hintAt:2,
 build(){p.x=70;fl(0,180);fl(225,480);S(0,60,46,140,{solid:false,front:true});S(458,60,22,140);star(20);
  const fk={x:426,y:FY-18,w:14,h:18};g.props.push({type:'star',r:fk,evil:false});const pr=g.props[0];
  const q=hid(300,330);at(262,()=>pop(q));
  Z(fk,()=>{pr.evil=true;say('That was A star. Not THE star.');die('bite')})},
 sol:[['L',win]]},

{cap:'You can trust the floor now.',hint:'psst: no dust lands on fake floor.',
 build(){g.dust=2;fl(0,120);fl(120,160,{solid:false});fl(160,230);fl(230,290,{solid:false});fl(290,400);fl(400,436,{solid:false});S(436,FY,20,130);fl(456,480,{solid:false});star(446)},
 sol:[['R',px(106)],['RJ',land],['R',px(222)],['RJ',land],['R',px(380)],['RJ',win]]},

/* ---------------- level lifecycle ---------------- */
function start(i){
  if(i!==lvI){lvI=i;lvT=0;ck63=1}
  if(bot){bot.si=0;bot.st=0}
  cur=i;const ch=Math.floor(i/4);
  g={i,ch,pal:PAL[ch],t:0,state:'play',solids:[],spikes:[],zones:[],whens:[],timers:[],tweens:[],ticks:[],balls:[],props:[],decor:[],parts:[],motes:[],
     vars:{},goal:null,cap:{text:LV[i].cap,n:0,x:240,y:30,sh:0},fx:{rot:0,dark:0},quake:0,flash:0,dust:0,dt:0,pending:null,intro:SIM?0:.0};
  f=g.f={rev:false,G:1,ice:false,wrap:false,jumps:null,open:false};
  p=g.p={x:30,y:FY-14,w:10,h:14,vx:0,vy:0,on:false,ground:null,coy:0,buf:0,jumping:false,face:1,sq:1,run:0,landT:-9,landAir:0,airT:0,dead:false};
  LV[i].build();
  if(p.y===FY-14&&f.G>0){p.on=true}
  if(!SIM){stage.style.background=g.pal.bg;document.body.style.background=ch===5?'#0e0e14':'#17151c'}
}
function die(why){
  if(g.state!=='play')return;g.state='dead';g.dt=.6;p.dead=true;
  if(SIM)return;
  sfx('die');quake(.25);save.deaths++;deathsHere[g.i]=(deathsHere[g.i]||0)+1;store();
  const st=stains[g.i]||(stains[g.i]=[]);st.push({x:Math.max(4,Math.min(W-4,p.x+5)),y:Math.max(8,Math.min(H-3,p.y+12)),s:Math.random()});if(st.length>50)st.shift();
  for(let j=0;j<16;j++){const a=Math.random()*6.28,v=40+Math.random()*130;g.parts.push({x:p.x+5,y:p.y+7,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:.5+Math.random()*.4,r:1.5+Math.random()*2,c:g.pal.ink,gr:500})}
  if(why!=='bite'&&Math.random()<.75)say(QUIPS[(Math.random()*QUIPS.length)|0]);
}
function confetti(x,y){if(SIM)return;const cs=['#FFD31D','#E4572E','#fff8e7','#3BB273','#4D9DE0'];for(let j=0;j<26;j++){const a=Math.random()*6.28,v=50+Math.random()*150;g.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,life:.7+Math.random()*.5,r:1.6+Math.random()*1.6,c:cs[j%5],gr:420})}}
function winLevel(){
  g.state='win';g.dt=.9;
  if(SIM)return;
  sfx('win');confetti(g.goal.x+7,g.goal.y+9);
  if(g.i+1>save.un){save.un=Math.min(LV.length-1,g.i+1)}
  if(g.i===LV.length-1)save.done=true;store();
}

/* ---------------- simulation step ---------------- */
const EASE={lin:t=>t,in:t=>t*t,out:t=>1-(1-t)*(1-t),io:t=>t<.5?2*t*t:1-2*(1-t)*(1-t)};
function moveP(dx,dy){
  const ss=g.solids;
  p.x+=dx;
  for(const s of ss)if(s.solid&&hit(p,s)){if(dx>0)p.x=s.x-p.w;else if(dx<0)p.x=s.x+s.w;p.vx=0}
  p.y+=dy;
  for(const s of ss)if(s.solid&&hit(p,s)){
    if(dy>0){p.y=s.y-p.h;if(f.G>0)ground(s)}else if(dy<0){p.y=s.y+s.h;if(f.G<0)ground(s)}
    p.vy=0}
}
function ground(s){
  if(!p.wasOn&&p.airT>.06){p.landT=g.t;p.landAir=p.airT;p.sq=.72;if(p.airT>.2)puff(p.x+5,f.G>0?p.y+p.h:p.y,3)}
  p.on=true;p.ground=s;s.seen=1;
}
function step(){
  if(g.pending){const fn=g.pending;g.pending=null;fn()}
  g.t+=DT;
  if(g.state==='dead'||g.state==='win'){g.dt-=DT;stepFx();return}
  for(const s of g.solids){s.px=s.x;s.py=s.y}
  // timers
  for(let i=0;i<g.timers.length;i++){const t=g.timers[i];t.t-=DT;if(t.t<=0&&!t.d){t.d=1;t.fn()}}
  g.timers=g.timers.filter(t=>!t.d);
  // tweens
  for(let i=0;i<g.tweens.length;i++){const t=g.tweens[i];t.t+=DT;const q=Math.min(1,t.t/t.d),e=EASE[t.ease](q);
    for(const key in t.to)t.o[key]=t.from[key]+(t.to[key]-t.from[key])*e;
    if(q>=1&&!t.fin){t.fin=1;if(t.done)t.done()}}
  g.tweens=g.tweens.filter(t=>!t.fin);
  for(const fn of g.ticks)fn();
  // carried / pushed / crushed by moving solids
  const gs=p.ground;
  if(gs&&gs.solid&&(gs.x!==gs.px||gs.y!==gs.py)){const cx=gs.x-gs.px,cy=gs.y-gs.py;p.x+=cx;p.y+=cy;
    for(const o of g.solids)if(o!==gs&&o.solid&&hit(p,o)){if(cx&&Math.abs(cx)>=Math.abs(cy))p.x=cx<0?o.x+o.w:o.x-p.w;else if(o.x===o.px&&o.y===o.py){die('crush');break}}}
  for(const s of g.solids){
    if(!s.solid||(s.x===s.px&&s.y===s.py)||!hit(p,s))continue;
    const dx=s.x-s.px,dy=s.y-s.py;
    if(Math.abs(dx)>=Math.abs(dy))p.x=dx>0?s.x+s.w:s.x-p.w;else p.y=dy>0?s.y+s.h:s.y-p.h;
    for(const o of g.solids)if(o!==s&&o.solid&&hit(p,o)){die('crush');break}
    if(p.x<-2&&!f.open||p.x>W-p.w+2&&!f.open)die('crush');
  }
  if(g.state!=='play'){stepFx();return}
  // player
  const ax=((k.r?1:0)-(k.l?1:0))*(f.rev?-1:1);
  const acc=p.on?(f.ice?230:1500):1000,dec=p.on?(f.ice?140:1700):500;
  if(ax){const d=ax*SPD-p.vx;p.vx+=Math.max(-acc*DT,Math.min(acc*DT,d));p.face=ax}
  else{p.vx-=Math.max(-dec*DT,Math.min(dec*DT,p.vx))}
  p.buf-=DT;p.coy=p.on?.09:p.coy-DT;
  if(p.buf>0&&p.coy>0&&(f.jumps==null||f.jumps>0)){
    p.vy=-JV*f.G;p.buf=0;p.coy=0;p.jumping=true;p.sq=1.28;sfx('jump');
    if(f.jumps!=null){f.jumps--;if(f.jumps===0)after(.7,()=>say('That was your last one. I may have fibbed.'))}
  }
  if(p.jumping){if(!k.j&&p.vy*f.G<-95)p.vy=-95*f.G;if(p.vy*f.G>=0)p.jumping=false}
  p.vy+=GR*f.G*DT;if(p.vy>430)p.vy=430;if(p.vy<-430)p.vy=-430;
  p.wasOn=p.on;p.on=false;p.ground=null;
  moveP(p.vx*DT,p.vy*DT);
  if(p.on)p.airT=0;else p.airT+=DT;
  if(p.x<0){p.x=0;p.vx=0}
  if(!f.open&&p.x>W-p.w){p.x=W-p.w;p.vx=0}
  if(p.y>H+30){if(f.wrap){p.y=-30;if(!g.vars.wr){g.vars.wr=1;say('…Huh. That is new.')}}else die('fall')}
  if(p.y<-70&&f.G<0)die('fall');
  // triggers
  for(let i=0;i<g.whens.length;i++){const w=g.whens[i];if(!w.done&&w.cond()){w.done=true;w.fn()}}
  for(let i=0;i<g.zones.length;i++){const z=g.zones[i];if(!z.done&&hit(p,z.r)){z.done=true;z.fn()}}
  if(g.state!=='play'){stepFx();return}
  // hazards
  for(const s of g.spikes){if(!s.on)continue;
    if(p.x<s.x+s.w-2&&p.x+p.w>s.x+2&&p.y<s.y+s.h-2&&p.y+p.h>s.y+2){die('spike');break}}
  for(const b of g.balls){b.x+=b.vx*DT;b.y+=b.vy*DT;b.spin+=b.vx*DT/b.r;if(b.fn)b.fn();
    const cx=Math.max(p.x,Math.min(b.x,p.x+p.w)),cy=Math.max(p.y,Math.min(b.y,p.y+p.h));
    if((cx-b.x)*(cx-b.x)+(cy-b.y)*(cy-b.y)<(b.r-1.5)*(b.r-1.5))die('ball')}
  const G=g.goal;
  if(g.state==='play'&&G&&G.on&&hit(p,G))winLevel();
  stepFx();
}
function stepFx(){
  if(SIM)return;
  lvT+=DT;g.lt=lvT;
  if(g.cap.n<g.cap.text.length)g.cap.n+=DT*42;
  g.quake=Math.max(0,g.quake-DT);g.flash=Math.max(0,g.flash-DT);
  p.sq+=(1-p.sq)*Math.min(1,14*DT);
  if(p.on&&Math.abs(p.vx)>20)p.run+=DT*Math.abs(p.vx)*.11;
  for(const s of g.solids){if(s.sh>0)s.sh-=DT;if(s.seen>0&&p.ground!==s)s.seen-=DT*1.2}
  for(const s of g.spikes)if(s.sh>0)s.sh-=DT;
  if(g.cap.sh>0)g.cap.sh-=DT;
  for(const q of g.parts){q.life-=DT;q.vy+=q.gr*DT;q.x+=q.vx*DT;q.y+=q.vy*DT}
  if(g.parts.length)g.parts=g.parts.filter(q=>q.life>0);
  if(g.dust){
    if(Math.random()<(g.dust===2?.55:.32))g.motes.push({x:Math.random()*W,y:-4,vy:55+Math.random()*30,rest:0,sw:Math.random()*6});
    for(const m of g.motes){
      if(m.rest>0){m.rest-=DT;continue}
      m.y+=m.vy*DT;m.x+=Math.sin(g.t*2+m.sw)*8*DT;
      for(const s of g.solids)if(s.solid&&m.x>s.x&&m.x<s.x+s.w&&m.y>s.y&&m.y<s.y+6&&s.y>70){m.y=s.y-.5;m.rest=g.dust===2?3.2:2.6;m.done=1;break}
    }
    g.motes=g.motes.filter(m=>m.y<H+5&&!(m.done&&m.rest<=0));
  }
}

/* ---------------- rendering ---------------- */

/* ---------------- flow ---------------- */
let wipe=0,wipeTo=null,last=0,acc=0,playT=0,touchUI=false;
function show(id){['oTitle','oLevels','oPause','oEnd'].forEach(o=>$(o).classList.toggle('on',o===id));stage.classList.toggle('playing',mode==='play');pad.classList.toggle('on',touchUI&&mode==='play')}
function play(i){wipe=0;wipeTo=null;acc=0;lvI=-1;audio();if(AC&&AC.state==='suspended')AC.resume();mode='play';start(i);show(null);k.l=k.r=k.j=false}
function goMenu(){mode='menu';show('oTitle');$('bPlay').textContent=save.un>0&&!save.done?'CONTINUE':'PLAY'}
function pause(){if(mode!=='play')return;mode='pause';k.l=k.r=k.j=false;const dh=deathsHere[cur]||0;
  $('pInfo').textContent='Level '+(Math.floor(cur/4)+1)+'-'+(cur%4+1)+' · '+CHN[Math.floor(cur/4)]+' · '+save.deaths+' deaths';
  const can=dh>=8||cur<save.un;$('bSkip').disabled=!can||cur>=LV.length-1;$('skipInfo').textContent=can?'':'Skip unlocks after 8 deaths on this level ('+dh+'/8).';show('oPause')}

  $('eLine').textContent='The level has run out of lies. For now.';show('oEnd')}
function buildGrid(){const gr=$('grid');gr.innerHTML='';
  for(let c=0;c<6;c++){const n=document.createElement('div');n.className='cn';n.textContent=CHN[c];gr.appendChild(n);
    for(let j=0;j<4;j++){const i=c*4+j,b=document.createElement('button');b.textContent=(c+1)+'-'+(j+1);b.style.background=PAL[c].bg;b.style.color=PAL[c].fg==='#FFD31D'?'#FFD31D':PAL[c].fg;
      b.disabled=i>save.un;b.onclick=()=>play(i);gr.appendChild(b)}}}

      if(wipe>0){wipe+=DT*3.2;if(wipe>=1&&wipeTo!=null){const n=wipeTo;wipeTo=null;if(n>=LV.length){wipe=0;ending();break}start(n)}if(wipe>=2)wipe=0;if(wipe>0&&wipe<1.75)continue}

/* ---------------- input ---------------- */
function press(){if(mode==='play'){k.j=true;if(p)p.buf=.12}}
addEventListener('keydown',e=>{
  const c=e.code;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c))e.preventDefault();
  if(e.repeat)return;audio();
  if(c==='ArrowLeft'||c==='KeyA')k.l=true;
  else if(c==='ArrowRight'||c==='KeyD')k.r=true;
  else if(c==='Space'||c==='ArrowUp'||c==='KeyW'){if(mode==='menu'&&$('oTitle').classList.contains('on'))play(save.done?0:save.un);else press()}
  else if(c==='KeyR'){if(mode==='play'&&g.state==='play'&&!wipe)start(g.i)}
  else if(c==='KeyP'||c==='Escape'){mode==='pause'?resume():pause()}
  else if(c==='KeyM')setMute(!save.mute);
  else if(c==='Enter'&&mode==='menu'&&$('oTitle').classList.contains('on'))play(save.done?0:save.un);
});
addEventListener('keyup',e=>{const c=e.code;
  if(c==='ArrowLeft'||c==='KeyA')k.l=false;else if(c==='ArrowRight'||c==='KeyD')k.r=false;else if(c==='Space'||c==='ArrowUp'||c==='KeyW'){k.j=false;e.preventDefault()}});
addEventListener('blur',()=>{k.l=k.r=k.j=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(mode==='play')pause();if(AC)AC.suspend();store()}else if(AC)AC.resume()});
addEventListener('contextmenu',e=>e.preventDefault());
// touch pad: one sliding left/right zone + jump
const lr=$('lr'),jb=$('jb');let lrId=null;

['pointerup','pointercancel','lostpointercapture'].forEach(n=>lr.addEventListener(n,lrEnd));

['pointerup','pointercancel','lostpointercapture'].forEach(n=>jb.addEventListener(n,()=>{k.j=false;jb.classList.remove('dn')}));

// buttons

$('bPlay').onclick=()=>play(save.done?0:save.un);

$('bBack').onclick=goMenu;$('bMenu').onclick=()=>{store();goMenu()};
$('bSound').onclick=$('bSound2').onclick=()=>{audio();setMute(!save.mute)};
$('bPause').onclick=pause;$('bResume').onclick=resume;
$('bRe').onclick=()=>{if(mode==='play'&&g.state==='play'&&!wipe)start(g.i)};

/* ---------------- layout ---------------- */
touchUI=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
addEventListener('touchstart',()=>{if(!touchUI){touchUI=true;fit()}},{passive:true});

      const b=Math.max(56,Math.min(vw*.24,ph*.5,130)),cy=Math.max(14,Math.min(ph*.3,ph-b-18));
      lr.style.cssText=`left:${vw*.05}px;top:${cy}px;width:${b*2.08}px;height:${b}px`;
      jb.style.cssText=`right:${vw*.06}px;top:${cy-b*.06}px;width:${b*1.12}px;height:${b*1.12}px`}
    else{pad.style.cssText=`left:0;top:0;width:${vw}px;height:${vh}px`;
      const b=Math.max(46,Math.min(vh*.2,vw*.1,96)),m=Math.max(10,vw*.02);
      lr.style.cssText=`left:${m}px;bottom:${m}px;width:${b*2.08}px;height:${b}px`;
      jb.style.cssText=`right:${m}px;bottom:${m}px;width:${b*1.15}px;height:${b*1.15}px`}
    $('keysHint').textContent='Use the ◀ ▶ and JUMP buttons';
  }
  if(g)draw();
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,120));

function botKeys(){const s=LV[g.i].sol[bot.si]||['',win],ks=s[0];k.l=ks.includes('L');k.r=ks.includes('R');k.j=ks.includes('J');if(bot.st===0&&k.j)p.buf=.12}
function botAfter(){bot.st+=DT;const s=LV[g.i].sol[bot.si]||['',win],c=s[1];if(typeof c==='number'?bot.st>=c:c(g,bot.st)){bot.si++;bot.st=0}}
/* ---------------- self-test hook (used for QA and auto-play capture) ---------------- */
window.__pp={count:LV.length,
  sim(i){SIM=true;const was={l:k.l,r:k.r,j:k.j},wb=bot;bot={si:0,st:0};lvI=-1;start(i);let res=null;
    for(let n=0;n<120*40;n++){botKeys();step();
      if(g.state==='win'){res={ok:true,t:+g.t.toFixed(2)};break}
      if(g.state==='dead'){res={ok:false,why:'dead',step:bot.si,x:+p.x.toFixed(1),y:+p.y.toFixed(1),t:+g.t.toFixed(2)};break}
      botAfter()}
    if(!res)res={ok:false,why:'timeout',step:bot.si,x:+p.x.toFixed(1),y:+p.y.toFixed(1)};
    SIM=false;bot=wb;Object.assign(k,was);lvI=-1;return res},
  demo(on){bot=on?{si:0,st:0}:null;k.l=k.r=k.j=false},
  goto(i){play(i)},state:()=>({mode,i:g&&g.i,st:g&&g.state,x:p&&p.x,y:p&&p.y,deaths:save.deaths,wipe})
};

setMute(save.mute);start(0);fit();goMenu();requestAnimationFrame(frame);
})();
